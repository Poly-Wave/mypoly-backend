apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: mypoly
data:
  SPRING_PROFILES_ACTIVE: "local"
  SERVER_PORT: "8080"
  SERVER_FORWARD_HEADERS_STRATEGY: "framework"

  # DEV audiences (Android/iOS)
  #SPRING_PROFILES_ACTIVE: "local"
  #GOOGLE_ALLOWED_AUDIENCES: "714490493102-d26i4c6magpkh6f4brhi2dvml3d0idbd.apps.googleusercontent.com,714490493102-7t2uuej1thbk0oghfsf23bo9fgbjknsp.apps.googleusercontent.com,714490493102-jn4as4kqgt0c6chgd2vvlc7j6jkviv8i.apps.googleusercontent.com"
  #APPLE_ALLOWED_AUDIENCES: "kr.kro.mypoly.app.dev"

  # PROD audiences (Android/iOS)
  #SPRING_PROFILES_ACTIVE: "prod"
  #GOOGLE_ALLOWED_AUDIENCES: "714490493102-p61nemv3dskpkcd20r8mpnsthfhuo528.apps.googleusercontent.com,714490493102-8ncso7nlnftree69t40l5kgm8e06a77j.apps.googleusercontent.com,714490493102-u23e0teledqoucbaudstq25v3sq35qdf.apps.googleusercontent.com"
  #APPLE_ALLOWED_AUDIENCES: "kr.kro.mypoly.app"

  # DEV PROD 모두
  GOOGLE_ALLOWED_AUDIENCES: "714490493102-d26i4c6magpkh6f4brhi2dvml3d0idbd.apps.googleusercontent.com,714490493102-82qd3ftt7lvcnbdau3j7f0ko25ndtmpo.apps.googleusercontent.com,714490493102-trj6kfjoceqhloru93snmhvvsoooa5lg.apps.googleusercontent.com"
  APPLE_ALLOWED_AUDIENCES: "kr.kro.mypoly.app.dev,kr.kro.mypoly.app"

  DB_URL: "jdbc:postgresql://mypoly-postgres:5432/mypoly"

  # 회원 탈퇴 시 타 서비스 사용자 데이터 삭제 호출 endpoint (k8s DNS 기반).
  # bill-service 는 context-path(/bills)를 박고 있어 prefix 포함, notification-service 는 미사용.
  # internal 호출 키(BILL_SERVICE_INTERNAL_API_KEY / NOTIFICATION_ADMIN_API_KEY)는
  # mypoly-internal-api-secret 에서 주입된다(이미 마운트됨).
  BILL_SERVICE_URL: "http://bill-service/bills"
  NOTIFICATION_SERVICE_URL: "http://notification-service"