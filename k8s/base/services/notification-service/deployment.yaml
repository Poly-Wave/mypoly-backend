apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: mypoly
spec:
  # 스케줄러 중복 회피 위해 replicas=1 유지.
  # HA 필요해지면 ShedLock 등 분산 락 추가 후 늘릴 것.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/poly-wave/mypoly-notification-service:0.1
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            # user-service(/users), bill-service(/bills) 와 동일 컨벤션.
            # context-path 로 prefix 처리하면 swagger/actuator 도 자동으로 같은 prefix 아래로 들어와
            # 외부 (ingress) 와 내부 path 가 일치한다.
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: /notifications

          envFrom:
            # 서비스 자체 설정
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: notification-service-secret

            # 공통 DB
            - secretRef:
                name: mypoly-db-secret

            # 공통 JWT (사용자 access token 검증용)
            - configMapRef:
                name: mypoly-jwt-config
            - secretRef:
                name: mypoly-jwt-secret

            # 서비스 간 internal API 키 (3종 모두 필요 — admin/user/bill)
            - secretRef:
                name: mypoly-internal-api-secret

          readinessProbe:
            httpGet:
              path: /notifications/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /notifications/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
