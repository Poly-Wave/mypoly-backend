apiVersion: apps/v1
kind: Deployment
metadata:
  name: bill-service
  namespace: mypoly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bill-service
  template:
    metadata:
      labels:
        app: bill-service
    spec:
      containers:
        - name: bill-service
          image: ghcr.io/poly-wave/mypoly-bill-service:0.1
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: /bills

          envFrom:
            # 서비스 자체 설정
            - configMapRef:
                name: bill-service-config
            - secretRef:
                name: bill-service-secret

            # 공통 DB
            - secretRef:
                name: mypoly-db-secret

            # 공통 JWT 설정/시크릿 (Access 검증용)
            - configMapRef:
                name: mypoly-jwt-config
            - secretRef:
                name: mypoly-jwt-secret

            # 서비스 간 internal API 키 (BILL_SERVICE_INTERNAL_API_KEY 가드용)
            - secretRef:
                name: mypoly-internal-api-secret

          # 부팅이 80초 가까이 걸려 startupProbe 로 초기 진입을 보호한다.
          # startup 통과 전까지는 liveness/readiness 가 동작하지 않으므로 부팅 도중 kill 되지 않는다.
          startupProbe:
            httpGet:
              path: /bills/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30   # 최대 20 + 30*10 = 320초 부팅 허용

          readinessProbe:
            httpGet:
              path: /bills/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /bills/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6

          resources:
            # 2026-06 OOM 발생 (Last OOMKilled @ 2026-06-06).
            # bill-batch 가 신 API 마이그레이션 후 의안 row 가 늘면서
            # getInterestAgendas / RECENT_30D 같은 무거운 쿼리에서 메모리 spike 발생.
            # 안전 마진 위해 request 768Mi / limit 1.5Gi 로 상향.
            requests:
              cpu: "100m"
              memory: "768Mi"
            limits:
              cpu: "500m"
              memory: "1536Mi"