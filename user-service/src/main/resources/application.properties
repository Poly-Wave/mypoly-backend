spring.application.name=user-service
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=user_service

# DB 내부 저장은 TIMESTAMPTZ(UTC) 기준을 유지한다.
# API 응답 직렬화 timezone은 아래 jackson 설정으로 별도 제어한다.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# API 응답 시간 직렬화를 KST(Asia/Seoul, UTC+9)로 통일한다.
# Instant 등 시간 타입이 클라이언트로 내려갈 때 +09:00 오프셋으로 직렬화된다.
spring.jackson.time-zone=Asia/Seoul

# 요청/응답 바디 UTF-8 강제. Content-Type 에 charset 이 빠진 클라이언트(curl 등) 에서도
# 한글 본문이 깨지지 않도록 force=true 로 둔다.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=user_service
spring.flyway.schemas=user_service
spring.flyway.create-schemas=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Swagger 기본 비활성(로컬 profile에서만 활성 권장)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# 소셜 로그인(토큰 검증 방식) 옵션
social.dev-auth.enabled=false
social.dev-auth.key=${DEV_AUTH_KEY:}

# Kakao (aud 비슷한 검증용 app_id 옵션)
social.kakao.expected-app-id=${KAKAO_APP_ID:}

# Google/Apple (템플릿: ID_TOKEN 검증용, 확정되면 env 세팅)
social.google.client-id=${GOOGLE_CLIENT_ID:}
social.apple.client-id=${APPLE_CLIENT_ID:}

# Google ID token aud 허용 목록(콤마 구분)
social.google.allowed-audiences=${GOOGLE_ALLOWED_AUDIENCES:}

# Apple ID token aud 허용 목록(콤마 구분)
social.apple.allowed-audiences=${APPLE_ALLOWED_AUDIENCES:}

# DEV/LOCAL 전용 임시 회원 탈퇴 API
user.dev-delete.enabled=false

# notification-service 가 user-service 의 internal API 호출 시 사용하는 공유 키.
# - notification-service 의 NOTIFICATION_INTERNAL_API_KEY 와 동일한 값이어야 한다.
# - 비어있으면 /internal/segments/**, /internal/lookup/** 경로는 무조건 403 (fail-closed).
user-service.internal-api.key=${USER_SERVICE_INTERNAL_API_KEY:}