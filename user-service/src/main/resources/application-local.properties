springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

social.dev-auth.enabled=true
social.dev-auth.key=${DEV_AUTH_KEY:local-dev-key}

user.dev-delete.enabled=true

# 로컬에서 notification-service ↔ user-service 가 공유하는 internal API 키 기본값.
user-service.internal-api.key=${USER_SERVICE_INTERNAL_API_KEY:local-internal-key}

