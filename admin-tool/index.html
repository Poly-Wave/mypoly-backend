<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPoly DB Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ═══════════ CSS Variables & Reset ═══════════ */
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --bg-tertiary: #1a2234;
      --bg-card: #161d2e;
      --bg-hover: #1e2a42;
      --bg-input: #0d1423;
      --border: #1e2d45;
      --border-light: #2a3a55;
      --text-primary: #e8ecf4;
      --text-secondary: #8b95a8;
      --text-muted: #5a6478;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --info: #3b82f6;
      --info-bg: rgba(59, 130, 246, 0.12);
      --radius: 10px;
      --radius-sm: 6px;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
      --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
    }

    /* ═══════════ Layout ═══════════ */
    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 56px 1fr;
      height: 100vh;
    }

    /* ═══════════ Header ═══════════ */
    .header {
      grid-column: 1 / -1;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      z-index: 100;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.3px;
    }

    .header-logo .icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    .header-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-left: 24px;
    }

    .header-breadcrumb .sep { color: var(--text-muted); }
    .header-breadcrumb .current { color: var(--text-primary); font-weight: 500; }

    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    /* ═══════════ Sidebar ═══════════ */
    .sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px 0;
    }

    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }

    .sidebar-section {
      margin-bottom: 4px;
    }

    .sidebar-section-header {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      transition: color var(--transition);
      user-select: none;
    }

    .sidebar-section-header:hover { color: var(--text-secondary); }

    .sidebar-section-header .arrow {
      font-size: 10px;
      transition: transform var(--transition);
    }

    .sidebar-section-header.collapsed .arrow {
      transform: rotate(-90deg);
    }

    .sidebar-section-header .schema-badge {
      margin-left: auto;
      background: var(--bg-tertiary);
      color: var(--text-muted);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 500;
    }

    .sidebar-table-list {
      padding: 0;
      list-style: none;
    }

    .sidebar-table-list.hidden { display: none; }

    .sidebar-table-item {
      padding: 7px 16px 7px 28px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 2px solid transparent;
    }

    .sidebar-table-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .sidebar-table-item.active {
      background: var(--accent-glow);
      color: var(--accent-hover);
      border-left-color: var(--accent);
    }

    .sidebar-table-item .tbl-icon {
      font-size: 12px;
      opacity: 0.6;
    }

    /* ═══════════ Main Content ═══════════ */
    .main {
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .main-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--text-muted);
      font-size: 15px;
      flex-direction: column;
      gap: 12px;
    }

    .main-empty .empty-icon {
      font-size: 48px;
      opacity: 0.4;
    }

    /* ═══════════ Toolbar ═══════════ */
    .toolbar {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .toolbar-search {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toolbar-search select,
    .toolbar-search input {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color var(--transition);
    }

    .toolbar-search select { min-width: 140px; }
    .toolbar-search input { min-width: 200px; }

    .toolbar-search input:focus,
    .toolbar-search select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .toolbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-info {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ═══════════ Buttons ═══════════ */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .btn:hover { background: var(--bg-hover); border-color: var(--border-light); }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .btn-danger {
      background: var(--danger-bg);
      border-color: rgba(239, 68, 68, 0.3);
      color: var(--danger);
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }

    .btn-success {
      background: var(--success-bg);
      border-color: rgba(16, 185, 129, 0.3);
      color: var(--success);
    }
    .btn-success:hover { background: rgba(16, 185, 129, 0.2); }

    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-icon { padding: 6px 8px; }

    /* ═══════════ Data Table ═══════════ */
    .table-container {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    .table-container::-webkit-scrollbar { width: 6px; height: 6px; }
    .table-container::-webkit-scrollbar-track { background: transparent; }
    .table-container::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table thead {
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .data-table th {
      background: var(--bg-tertiary);
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: color var(--transition);
    }

    .data-table th:hover { color: var(--text-primary); }

    .data-table th .sort-icon {
      display: inline-block;
      margin-left: 4px;
      opacity: 0.3;
      font-size: 10px;
    }

    .data-table th.sorted .sort-icon { opacity: 1; color: var(--accent); }

    .data-table th.pk-col { color: var(--warning); }

    .data-table td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      color: var(--text-primary);
      transition: background var(--transition);
    }

    .data-table tr:hover td {
      background: var(--bg-hover);
    }

    .data-table td.null-val {
      color: var(--text-muted);
      font-style: italic;
    }

    .data-table td.fk-val {
      color: var(--info);
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dashed;
      text-underline-offset: 3px;
    }

    .data-table td.fk-val:hover {
      color: var(--accent-hover);
    }

    .data-table td.actions-cell {
      white-space: nowrap;
      display: flex;
      gap: 4px;
    }

    /* Row actions column */
    .row-actions { width: 80px; text-align: center; }

    /* ═══════════ Pagination ═══════════ */
    .pagination {
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .pagination-info {
      font-size: 12px;
      color: var(--text-muted);
    }

    .pagination-controls {
      display: flex;
      gap: 4px;
    }

    .page-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      transition: all var(--transition);
    }

    .page-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ═══════════ Bottom Panel (Relationships) ═══════════ */
    .bottom-panel {
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 300ms ease;
    }

    .bottom-panel.open { max-height: 280px; overflow-y: auto; }

    .panel-header {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .panel-header h3 {
      font-size: 13px;
      font-weight: 600;
    }

    .panel-header .toggle-icon {
      margin-left: auto;
      font-size: 12px;
      transition: transform var(--transition);
    }

    .panel-header .toggle-icon.rotated { transform: rotate(180deg); }

    .rel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      padding: 12px 20px;
    }

    .rel-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: pointer;
      transition: all var(--transition);
    }

    .rel-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-glow);
    }

    .rel-card .rel-type {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .rel-card .rel-type.outgoing { color: var(--info); }
    .rel-card .rel-type.incoming { color: var(--success); }

    .rel-card .rel-detail {
      font-size: 12px;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
    }

    .rel-card .rel-arrow { color: var(--text-muted); margin: 0 6px; }

    /* ═══════════ Modal ═══════════ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      animation: fadeIn 200ms ease;
    }

    .modal-overlay.show { display: flex; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 560px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      animation: slideUp 250ms ease;
    }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .modal-close {
      margin-left: auto;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 18px;
      transition: all var(--transition);
    }

    .modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }

    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body::-webkit-scrollbar { width: 4px; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .form-label .badge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-pk { background: var(--warning-bg); color: var(--warning); }
    .badge-fk { background: var(--info-bg); color: var(--info); }
    .badge-required { background: var(--danger-bg); color: var(--danger); }
    .badge-auto { background: rgba(139, 149, 168, 0.15); color: var(--text-muted); }
    .badge-type { background: rgba(139, 149, 168, 0.1); color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

    .form-input {
      width: 100%;
      padding: 9px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: border-color var(--transition);
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .form-input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .form-input.fk-input {
      border-left: 3px solid var(--info);
    }

    .form-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .fk-hint {
      color: var(--info);
      cursor: pointer;
    }

    .fk-hint:hover { text-decoration: underline; }

    .modal-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ═══════════ Column Info Panel ═══════════ */
    .column-info-toggle {
      position: relative;
    }

    /* ═══════════ Toast ═══════════ */
    .toast-container {
      position: fixed;
      top: 68px;
      right: 20px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      padding: 12px 18px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow);
      animation: slideInRight 300ms ease, fadeOut 300ms ease 2.7s forwards;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @keyframes slideInRight { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }

    .toast-success { background: #065f46; border: 1px solid var(--success); color: #d1fae5; }
    .toast-error { background: #7f1d1d; border: 1px solid var(--danger); color: #fecaca; }
    .toast-info { background: #1e3a5f; border: 1px solid var(--info); color: #bfdbfe; }

    /* ═══════════ Confirm Dialog ═══════════ */
    .confirm-body {
      text-align: center;
      padding: 10px 0;
    }

    .confirm-body .warn-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .confirm-body p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .confirm-body .warn-text {
      color: var(--danger);
      font-weight: 600;
    }

    /* ═══════════ Loading ═══════════ */
    .loading-spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--text-muted);
      gap: 10px;
      font-size: 13px;
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══════════ Responsive ═══════════ */
    select option { background: var(--bg-secondary); color: var(--text-primary); }
  </style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="header-logo">
      <span class="icon">⚡</span>
      <span>MyPoly DB Admin</span>
    </div>
    <div class="header-breadcrumb" id="breadcrumb">
      <span class="text-muted">테이블을 선택하세요</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-sm" id="btnColumnInfo" style="display:none" onclick="toggleColumnInfo()">📋 컬럼 정보</button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="loading-spinner" id="sidebarLoading">
      <div class="spinner"></div>
      <span>스키마 로딩중...</span>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main" id="mainContent">
    <div class="main-empty" id="emptyState">
      <div class="empty-icon">🗄️</div>
      <div>왼쪽 사이드바에서 테이블을 선택하세요</div>
      <div style="font-size:12px; color: var(--text-muted)">스키마별 테이블 목록이 자동으로 표시됩니다</div>
    </div>
  </main>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- CRUD Modal -->
<div class="modal-overlay" id="crudModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">레코드 추가</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal" style="width:420px">
    <div class="modal-header">
      <h2>삭제 확인</h2>
      <button class="modal-close" onclick="closeConfirm()">&times;</button>
    </div>
    <div class="modal-body" id="confirmBody"></div>
    <div class="modal-footer" id="confirmFooter"></div>
  </div>
</div>

<!-- Column Info Modal -->
<div class="modal-overlay" id="columnInfoModal">
  <div class="modal" style="width:680px">
    <div class="modal-header">
      <h2 id="colInfoTitle">컬럼 정보</h2>
      <button class="modal-close" onclick="closeColumnInfo()">&times;</button>
    </div>
    <div class="modal-body" id="colInfoBody" style="padding:0"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  State
// ═══════════════════════════════════════════
const BASE_PATH = window.location.pathname.startsWith('/db-admin') ? '/db-admin' : '';
const API = BASE_PATH;
let state = {
  schemas: [],
  tables: {},           // { schemaName: [tableName, ...] }
  currentSchema: null,
  currentTable: null,
  columns: [],
  relationships: { outgoing: [], incoming: [] },
  data: [],
  totalRows: 0,
  page: 1,
  limit: 50,
  sortBy: '',
  sortDir: 'ASC',
  searchColumn: '',
  searchText: '',
  pkColumn: null,
  fkMap: {},            // { columnName: { toSchema, toTable, toColumn } }
};

// ═══════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════
(async function init() {
  try {
    const schemas = await fetchJson('/api/schemas');
    state.schemas = schemas;
    for (const s of schemas) {
      state.tables[s] = await fetchJson(`/api/schemas/${s}/tables`);
    }
    renderSidebar();
  } catch (err) {
    document.getElementById('sidebarLoading').innerHTML =
      `<span style="color:var(--danger)">DB 연결 실패: ${err.message}</span>`;
  }
})();

// ═══════════════════════════════════════════
//  Fetch helpers
// ═══════════════════════════════════════════
async function fetchJson(url) {
  const res = await fetch(API + url);
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody.error || res.statusText);
  }
  return res.json();
}

async function postJson(url, body) {
  const res = await fetch(API + url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody.error || res.statusText);
  }
  return res.json();
}

async function putJson(url, body) {
  const res = await fetch(API + url, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody.error || res.statusText);
  }
  return res.json();
}

async function deleteReq(url) {
  const res = await fetch(API + url, { method: 'DELETE' });
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody.error || res.statusText);
  }
  return res.json();
}

// ═══════════════════════════════════════════
//  Sidebar Render
// ═══════════════════════════════════════════
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  for (const schema of state.schemas) {
    const tables = state.tables[schema] || [];
    const section = document.createElement('div');
    section.className = 'sidebar-section';

    const header = document.createElement('div');
    header.className = 'sidebar-section-header';
    header.innerHTML = `
      <span class="arrow">▼</span>
      <span>${schema}</span>
      <span class="schema-badge">${tables.length}</span>
    `;
    header.onclick = () => {
      header.classList.toggle('collapsed');
      list.classList.toggle('hidden');
    };

    const list = document.createElement('ul');
    list.className = 'sidebar-table-list';

    for (const t of tables) {
      const li = document.createElement('li');
      li.className = 'sidebar-table-item';
      li.dataset.schema = schema;
      li.dataset.table = t;
      li.innerHTML = `<span class="tbl-icon">⊞</span> ${t}`;
      li.onclick = () => selectTable(schema, t);
      list.appendChild(li);
    }

    section.appendChild(header);
    section.appendChild(list);
    sb.appendChild(section);
  }
}

// ═══════════════════════════════════════════
//  Table Selection
// ═══════════════════════════════════════════
async function selectTable(schema, table) {
  // Active state
  document.querySelectorAll('.sidebar-table-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.querySelector(`.sidebar-table-item[data-schema="${schema}"][data-table="${table}"]`);
  if (activeEl) activeEl.classList.add('active');

  state.currentSchema = schema;
  state.currentTable = table;
  state.page = 1;
  state.sortBy = '';
  state.sortDir = 'ASC';
  state.searchColumn = '';
  state.searchText = '';

  // Breadcrumb
  document.getElementById('breadcrumb').innerHTML = `
    <span>${schema}</span>
    <span class="sep">›</span>
    <span class="current">${table}</span>
  `;
  document.getElementById('btnColumnInfo').style.display = '';

  // Load metadata
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><span>로딩중...</span></div>';

  try {
    const [cols, rels] = await Promise.all([
      fetchJson(`/api/schemas/${schema}/tables/${table}/columns`),
      fetchJson(`/api/schemas/${schema}/tables/${table}/relationships`),
    ]);

    state.columns = cols;
    state.relationships = rels;
    state.pkColumn = cols.find(c => c.is_primary_key)?.column_name || cols[0]?.column_name;

    // Build FK map
    state.fkMap = {};
    for (const fk of rels.outgoing) {
      state.fkMap[fk.from_column] = {
        toSchema: fk.to_schema,
        toTable: fk.to_table,
        toColumn: fk.to_column,
      };
    }

    await loadData();
  } catch (err) {
    main.innerHTML = `<div class="main-empty"><span style="color:var(--danger)">오류: ${err.message}</span></div>`;
  }
}

async function loadData() {
  const { currentSchema: schema, currentTable: table, page, limit, sortBy, sortDir, searchColumn, searchText } = state;

  const params = new URLSearchParams({ page, limit });
  if (sortBy) { params.set('sortBy', sortBy); params.set('sortDir', sortDir); }
  if (searchColumn && searchText) { params.set('searchColumn', searchColumn); params.set('search', searchText); }

  const [data, countResult] = await Promise.all([
    fetchJson(`/api/schemas/${schema}/tables/${table}/data?${params}`),
    fetchJson(`/api/schemas/${schema}/tables/${table}/count?${searchColumn && searchText ? `searchColumn=${searchColumn}&search=${searchText}` : ''}`),
  ]);

  state.data = data;
  state.totalRows = countResult.total;

  renderMainContent();
}

// ═══════════════════════════════════════════
//  Main Content Render
// ═══════════════════════════════════════════
function renderMainContent() {
  const main = document.getElementById('mainContent');
  const { columns, data, totalRows, page, limit, sortBy, sortDir, relationships, currentSchema, currentTable, fkMap, pkColumn } = state;

  const totalPages = Math.ceil(totalRows / limit) || 1;

  main.innerHTML = `
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-search">
        <select id="searchColSelect">
          <option value="">컬럼 선택</option>
          ${columns.map(c => `<option value="${c.column_name}" ${c.column_name === state.searchColumn ? 'selected' : ''}>${c.column_name}</option>`).join('')}
        </select>
        <input type="text" id="searchInput" placeholder="검색어 입력..." value="${escHtml(state.searchText)}" />
        <button class="btn btn-sm" onclick="doSearch()">🔍 검색</button>
        ${state.searchText ? '<button class="btn btn-sm" onclick="clearSearch()">✕</button>' : ''}
      </div>
      <div class="toolbar-right">
        <span class="toolbar-info">${totalRows.toLocaleString()} rows · Page ${page}/${totalPages}</span>
        <button class="btn btn-sm" onclick="refreshData()">🔄</button>
        <button class="btn btn-sm btn-primary" onclick="openCreateModal()">＋ 새 레코드</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th class="row-actions" style="cursor:default">작업</th>
            ${columns.map(c => {
              const isPk = c.is_primary_key;
              const isFk = !!fkMap[c.column_name];
              const sorted = sortBy === c.column_name;
              const icon = sorted ? (sortDir === 'ASC' ? '▲' : '▼') : '⇅';
              return `<th class="${isPk ? 'pk-col' : ''} ${sorted ? 'sorted' : ''}"
                         onclick="sortColumn('${c.column_name}')"
                         title="${c.data_type}${isPk ? ' (PK)' : ''}${isFk ? ' (FK)' : ''}">
                ${isPk ? '🔑 ' : ''}${isFk ? '🔗 ' : ''}${c.column_name}
                <span class="sort-icon">${icon}</span>
              </th>`;
            }).join('')}
          </tr>
        </thead>
        <tbody>
          ${data.length === 0 ? `<tr><td colspan="${columns.length + 1}" style="text-align:center;padding:40px;color:var(--text-muted)">데이터가 없습니다</td></tr>` : ''}
          ${data.map(row => {
            const pkVal = row[pkColumn];
            return `<tr>
              <td class="row-actions" style="display:flex; gap:4px; justify-content:center">
                <button class="btn btn-sm btn-icon" onclick="openEditModal('${escAttr(String(pkVal))}')" title="수정">✏️</button>
                <button class="btn btn-sm btn-icon btn-danger" onclick="confirmDelete('${escAttr(String(pkVal))}')" title="삭제">🗑</button>
              </td>
              ${columns.map(c => {
                const val = row[c.column_name];
                const isFk = !!fkMap[c.column_name];
                if (val === null || val === undefined) {
                  return `<td class="null-val">NULL</td>`;
                }
                if (isFk) {
                  const fk = fkMap[c.column_name];
                  return `<td class="fk-val" onclick="navigateFK('${fk.toSchema}','${fk.toTable}','${fk.toColumn}','${escAttr(String(val))}')" title="→ ${fk.toTable}.${fk.toColumn}">${escHtml(truncate(String(val), 40))}</td>`;
                }
                const display = typeof val === 'object' ? JSON.stringify(val) : String(val);
                return `<td title="${escAttr(display)}">${escHtml(truncate(display, 60))}</td>`;
              }).join('')}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination">
      <div class="pagination-info">
        전체 ${totalRows.toLocaleString()}개 중 ${((page-1)*limit+1).toLocaleString()} - ${Math.min(page*limit, totalRows).toLocaleString()}
      </div>
      <div class="pagination-controls">
        <button class="page-btn" onclick="goPage(1)" ${page<=1?'disabled':''}>«</button>
        <button class="page-btn" onclick="goPage(${page-1})" ${page<=1?'disabled':''}>‹</button>
        ${generatePageButtons(page, totalPages)}
        <button class="page-btn" onclick="goPage(${page+1})" ${page>=totalPages?'disabled':''}>›</button>
        <button class="page-btn" onclick="goPage(${totalPages})" ${page>=totalPages?'disabled':''}>»</button>
      </div>
    </div>

    <!-- Relationships Panel -->
    ${(relationships.outgoing.length > 0 || relationships.incoming.length > 0) ? `
    <div class="bottom-panel open" id="relPanel">
      <div class="panel-header" onclick="toggleRelPanel()">
        <span>🔗</span>
        <h3>연관 테이블 (FK Relationships)</h3>
        <span style="font-size:11px;color:var(--text-muted)">
          참조 ${relationships.outgoing.length}개 · 피참조 ${relationships.incoming.length}개
        </span>
        <span class="toggle-icon rotated" id="relToggleIcon">▲</span>
      </div>
      <div class="rel-grid">
        ${relationships.outgoing.map(r => `
          <div class="rel-card" onclick="selectTable('${r.to_schema}', '${r.to_table}')">
            <div class="rel-type outgoing">→ 참조하는 테이블</div>
            <div class="rel-detail">
              ${currentTable}.<strong>${r.from_column}</strong>
              <span class="rel-arrow">→</span>
              ${r.to_table}.<strong>${r.to_column}</strong>
            </div>
          </div>
        `).join('')}
        ${relationships.incoming.map(r => `
          <div class="rel-card" onclick="selectTable('${r.from_schema}', '${r.from_table}')">
            <div class="rel-type incoming">← 참조되는 테이블</div>
            <div class="rel-detail">
              ${r.from_table}.<strong>${r.from_column}</strong>
              <span class="rel-arrow">→</span>
              ${currentTable}.<strong>${r.to_column}</strong>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
    ` : ''}
  `;

  // Bind search on Enter
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  }
}

// ═══════════════════════════════════════════
//  Actions
// ═══════════════════════════════════════════
function sortColumn(col) {
  if (state.sortBy === col) {
    state.sortDir = state.sortDir === 'ASC' ? 'DESC' : 'ASC';
  } else {
    state.sortBy = col;
    state.sortDir = 'ASC';
  }
  state.page = 1;
  loadData();
}

function goPage(p) {
  const totalPages = Math.ceil(state.totalRows / state.limit) || 1;
  if (p < 1 || p > totalPages) return;
  state.page = p;
  loadData();
}

function doSearch() {
  const col = document.getElementById('searchColSelect')?.value;
  const text = document.getElementById('searchInput')?.value;
  state.searchColumn = col;
  state.searchText = text;
  state.page = 1;
  loadData();
}

function clearSearch() {
  state.searchColumn = '';
  state.searchText = '';
  state.page = 1;
  loadData();
}

function refreshData() { loadData(); }

async function navigateFK(schema, table, column, value) {
  await selectTable(schema, table);
  // Set search to FK value
  state.searchColumn = column;
  state.searchText = value;
  state.page = 1;
  await loadData();
}

function toggleRelPanel() {
  const panel = document.getElementById('relPanel');
  const icon = document.getElementById('relToggleIcon');
  if (panel) {
    panel.classList.toggle('open');
    icon?.classList.toggle('rotated');
  }
}

// ═══════════════════════════════════════════
//  CRUD Modals
// ═══════════════════════════════════════════
function openCreateModal() {
  const { columns, fkMap } = state;
  document.getElementById('modalTitle').textContent = `새 레코드 추가 — ${state.currentTable}`;

  const body = document.getElementById('modalBody');
  body.innerHTML = columns.map(c => {
    const isPk = c.is_primary_key;
    const isFk = !!fkMap[c.column_name];
    const isAuto = c.column_default && (c.column_default.includes('nextval') || c.column_default.includes('gen_random'));
    const isRequired = c.is_nullable === 'NO' && !isAuto;
    const fk = fkMap[c.column_name];

    return `
      <div class="form-group">
        <label class="form-label">
          ${c.column_name}
          ${isPk ? '<span class="badge badge-pk">PK</span>' : ''}
          ${isFk ? '<span class="badge badge-fk">FK</span>' : ''}
          ${isRequired ? '<span class="badge badge-required">필수</span>' : ''}
          ${isAuto ? '<span class="badge badge-auto">자동생성</span>' : ''}
          <span class="badge badge-type">${c.udt_name}</span>
        </label>
        <input class="form-input ${isFk ? 'fk-input' : ''}"
               id="field_${c.column_name}"
               placeholder="${isAuto ? '자동 생성됩니다' : c.data_type}"
               ${isAuto ? 'disabled' : ''}
        />
        ${isFk ? `<div class="form-hint">🔗 <span class="fk-hint" onclick="selectTable('${fk.toSchema}','${fk.toTable}')">${fk.toTable}.${fk.toColumn}</span> 을 참조합니다</div>` : ''}
        ${c.column_default && !isAuto ? `<div class="form-hint">기본값: ${escHtml(c.column_default)}</div>` : ''}
      </div>
    `;
  }).join('');

  document.getElementById('modalFooter').innerHTML = `
    <button class="btn" onclick="closeModal()">취소</button>
    <button class="btn btn-primary" onclick="submitCreate()">저장</button>
  `;

  document.getElementById('crudModal').classList.add('show');
}

async function submitCreate() {
  const { columns, currentSchema, currentTable } = state;
  const data = {};
  for (const c of columns) {
    const isAuto = c.column_default && (c.column_default.includes('nextval') || c.column_default.includes('gen_random'));
    if (isAuto) continue;
    const el = document.getElementById(`field_${c.column_name}`);
    if (el && el.value !== '') {
      data[c.column_name] = el.value;
    }
  }

  try {
    await postJson(`/api/schemas/${currentSchema}/tables/${currentTable}/data`, data);
    closeModal();
    toast('레코드가 생성되었습니다', 'success');
    loadData();
  } catch (err) {
    toast(`생성 실패: ${err.message}`, 'error');
  }
}

async function openEditModal(pkVal) {
  const { columns, fkMap, currentSchema, currentTable, pkColumn } = state;

  try {
    const row = await fetchJson(`/api/schemas/${currentSchema}/tables/${currentTable}/data/${encodeURIComponent(pkVal)}?pkColumn=${pkColumn}`);

    document.getElementById('modalTitle').textContent = `레코드 수정 — ${currentTable}`;

    const body = document.getElementById('modalBody');
    body.innerHTML = columns.map(c => {
      const isPk = c.is_primary_key;
      const isFk = !!fkMap[c.column_name];
      const fk = fkMap[c.column_name];
      const val = row[c.column_name];
      const displayVal = val === null || val === undefined ? '' : (typeof val === 'object' ? JSON.stringify(val) : String(val));

      return `
        <div class="form-group">
          <label class="form-label">
            ${c.column_name}
            ${isPk ? '<span class="badge badge-pk">PK</span>' : ''}
            ${isFk ? '<span class="badge badge-fk">FK</span>' : ''}
            <span class="badge badge-type">${c.udt_name}</span>
          </label>
          <input class="form-input ${isFk ? 'fk-input' : ''}"
                 id="edit_${c.column_name}"
                 value="${escAttr(displayVal)}"
                 ${isPk ? 'disabled' : ''}
          />
          ${isFk ? `<div class="form-hint">🔗 <span class="fk-hint" onclick="selectTable('${fk.toSchema}','${fk.toTable}')">${fk.toTable}.${fk.toColumn}</span> 을 참조합니다</div>` : ''}
        </div>
      `;
    }).join('');

    document.getElementById('modalFooter').innerHTML = `
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="submitEdit('${escAttr(String(pkVal))}')">수정 저장</button>
    `;

    document.getElementById('crudModal').classList.add('show');
  } catch (err) {
    toast(`조회 실패: ${err.message}`, 'error');
  }
}

async function submitEdit(pkVal) {
  const { columns, currentSchema, currentTable, pkColumn } = state;
  const data = {};
  for (const c of columns) {
    if (c.is_primary_key) continue;
    const el = document.getElementById(`edit_${c.column_name}`);
    if (el) {
      data[c.column_name] = el.value === '' ? null : el.value;
    }
  }

  try {
    await putJson(`/api/schemas/${currentSchema}/tables/${currentTable}/data/${encodeURIComponent(pkVal)}?pkColumn=${pkColumn}`, data);
    closeModal();
    toast('레코드가 수정되었습니다', 'success');
    loadData();
  } catch (err) {
    toast(`수정 실패: ${err.message}`, 'error');
  }
}

function confirmDelete(pkVal) {
  const { currentTable, relationships } = state;

  document.getElementById('confirmBody').innerHTML = `
    <div class="confirm-body">
      <div class="warn-icon">⚠️</div>
      <p>정말로 이 레코드를 삭제하시겠습니까?</p>
      <p><strong>${currentTable}</strong> (PK: ${pkVal})</p>
      ${relationships.incoming.length > 0 ? `
        <p style="margin-top:12px" class="warn-text">
          ⚠️ 이 테이블을 참조하는 ${relationships.incoming.length}개의 테이블이 있습니다:
        </p>
        <p style="font-size:12px; color:var(--text-muted)">
          ${relationships.incoming.map(r => `${r.from_table}.${r.from_column}`).join(', ')}
        </p>
      ` : ''}
    </div>
  `;

  document.getElementById('confirmFooter').innerHTML = `
    <button class="btn" onclick="closeConfirm()">취소</button>
    <button class="btn btn-danger" onclick="executeDelete('${escAttr(String(pkVal))}')">삭제</button>
  `;

  document.getElementById('confirmModal').classList.add('show');
}

async function executeDelete(pkVal) {
  const { currentSchema, currentTable, pkColumn } = state;
  try {
    await deleteReq(`/api/schemas/${currentSchema}/tables/${currentTable}/data/${encodeURIComponent(pkVal)}?pkColumn=${pkColumn}`);
    closeConfirm();
    toast('레코드가 삭제되었습니다', 'success');
    loadData();
  } catch (err) {
    closeConfirm();
    toast(`삭제 실패: ${err.message}`, 'error');
  }
}

function closeModal() { document.getElementById('crudModal').classList.remove('show'); }
function closeConfirm() { document.getElementById('confirmModal').classList.remove('show'); }

// ═══════════════════════════════════════════
//  Column Info Modal
// ═══════════════════════════════════════════
function toggleColumnInfo() {
  const { columns, currentTable, fkMap } = state;
  document.getElementById('colInfoTitle').textContent = `컬럼 정보 — ${currentTable}`;

  const body = document.getElementById('colInfoBody');
  body.innerHTML = `
    <table class="data-table" style="font-size:12px">
      <thead>
        <tr>
          <th>컬럼명</th>
          <th>타입</th>
          <th>Nullable</th>
          <th>PK</th>
          <th>FK</th>
          <th>기본값</th>
        </tr>
      </thead>
      <tbody>
        ${columns.map(c => {
          const fk = fkMap[c.column_name];
          return `<tr>
            <td style="font-weight:600">${c.column_name}</td>
            <td><span class="badge badge-type">${c.udt_name}${c.character_maximum_length ? `(${c.character_maximum_length})` : ''}</span></td>
            <td>${c.is_nullable === 'YES' ? '<span style="color:var(--success)">✓</span>' : '<span style="color:var(--danger)">✗</span>'}</td>
            <td>${c.is_primary_key ? '<span class="badge badge-pk">PK</span>' : ''}</td>
            <td>${fk ? `<span class="badge badge-fk" style="cursor:pointer" onclick="closeColumnInfo();selectTable('${fk.toSchema}','${fk.toTable}')">${fk.toTable}.${fk.toColumn}</span>` : ''}</td>
            <td style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted)">${c.column_default ? escHtml(c.column_default) : ''}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;

  document.getElementById('columnInfoModal').classList.add('show');
}

function closeColumnInfo() { document.getElementById('columnInfoModal').classList.remove('show'); }

// ═══════════════════════════════════════════
//  Utilities
// ═══════════════════════════════════════════
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function truncate(s, len) {
  return s.length > len ? s.slice(0, len) + '…' : s;
}

function generatePageButtons(current, total) {
  const pages = [];
  const range = 2;
  let start = Math.max(1, current - range);
  let end = Math.min(total, current + range);

  if (start > 1) pages.push(1);
  if (start > 2) pages.push('...');
  for (let i = start; i <= end; i++) pages.push(i);
  if (end < total - 1) pages.push('...');
  if (end < total) pages.push(total);

  return pages.map(p => {
    if (p === '...') return `<span style="padding:0 4px;color:var(--text-muted)">…</span>`;
    return `<button class="page-btn ${p === current ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
  }).join('');
}

function toast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  el.innerHTML = `${icons[type] || ''} ${escHtml(message)}`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
</script>
