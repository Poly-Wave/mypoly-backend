springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# 로컬 어드민 API 키 기본값
notification.admin-api.key=${NOTIFICATION_ADMIN_API_KEY:local-admin-key}

# 로컬에서는 dev 트리거 켬
notification.dev-trigger.enabled=true

# 로컬에서 user-service 직접 호출 (호스트에서 5433 postgres 와 8080 user-service 사용)
user-service.url=${USER_SERVICE_URL:http://localhost:18080}
user-service.internal-api.key=${USER_SERVICE_INTERNAL_API_KEY:local-internal-key}

# 로컬에서 bill-service 직접 호출
bill-service.url=${BILL_SERVICE_URL:http://localhost:18081}
bill-service.internal-api.key=${BILL_SERVICE_INTERNAL_API_KEY:local-bill-internal-key}
