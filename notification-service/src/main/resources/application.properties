spring.application.name=notification-service
server.port=${SERVER_PORT:8082}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=notification_service

# DB 내부 저장은 TIMESTAMPTZ(UTC) 기준
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# API 응답 시간 직렬화 KST
spring.jackson.time-zone=Asia/Seoul

# 요청/응답 바디 UTF-8 강제
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=notification_service
spring.flyway.schemas=notification_service
spring.flyway.create-schemas=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Swagger 기본 비활성(로컬에서만 활성)
# context-path 를 쓰지 않으므로(사용자 API 만 /notifications prefix), swagger 경로를 명시적으로 /notifications 아래에 둔다.
# 이렇게 해야 ingress 의 /notifications prefix 라우팅으로 swagger 가 외부 노출되고,
# /internal/**, /dev-notifications/** 는 prefix 밖이라 ingress 가 라우팅하지 않아 자연 격리된다.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/notifications/v3/api-docs
springdoc.swagger-ui.path=/notifications/swagger-ui.html
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# 알림 정책 관리(/internal/notification-policies/**) 전용 어드민 API 키
notification.admin-api.key=${NOTIFICATION_ADMIN_API_KEY:}

# DEV/LOCAL 전용 알림 강제 발급 트리거
notification.dev-trigger.enabled=false

# 알림 스케줄러 자동 실행 on/off
notification.scheduler.enabled=false
# 행 1·2 — 매일 12:00 KST 온보딩 D+1 리마인더
notification.scheduler.onboarding-remind-cron=0 0 12 * * *
# 행 4·5 — 매일 18:00 KST 홈 broadcast (요즘 핫한 / 최근 30일 인기)
notification.scheduler.daily-home-broadcast-cron=0 0 18 * * *
# 행 7 — 매일 12:00 KST 북마크 D+1 미투표 리마인더
notification.scheduler.bookmark-no-vote-remind-cron=0 0 12 * * *
# 행 3 — 매일 09:00 KST 관심 카테고리 매칭 신규 안건
notification.scheduler.daily-interest-agenda-cron=0 0 9 * * *
# 행 6 — 북마크 단계 변경 polling 주기(ms). 기본 10분.
notification.scheduler.bill-stage-change-fixed-delay-ms=600000
# 공지사항 등록 broadcast polling 주기(ms). 기본 5분.
notification.scheduler.notice-broadcast-fixed-delay-ms=300000

# user-service 호출용 endpoint + 공유 internal API 키
user-service.url=${USER_SERVICE_URL:http://user-service:80}
user-service.internal-api.key=${USER_SERVICE_INTERNAL_API_KEY:}

# bill-service 호출용 endpoint + 공유 internal API 키
bill-service.url=${BILL_SERVICE_URL:http://bill-service:80}
bill-service.internal-api.key=${BILL_SERVICE_INTERNAL_API_KEY:}
