services:
  db:
    image: postgres:15-alpine
    container_name: mypoly-postgres
    restart: unless-stopped

    env_file:
      - ./.env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: ghcr.io/poly-wave/mypoly-user-service:0.2
    container_name: mypoly-user-service
    restart: unless-stopped

    env_file:
      - ./.env
      - ./user-service/.env

    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: "8080"
      SERVER_SERVLET_CONTEXT_PATH: ${SERVER_SERVLET_CONTEXT_PATH:-}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}

    ports:
      - "${USER_SERVICE_PORT:-8080}:8080"

    depends_on:
      db:
        condition: service_healthy

  bill-service:
    build:
      context: .
      dockerfile: bill-service/Dockerfile
    image: ghcr.io/poly-wave/mypoly-bill-service:0.2
    container_name: mypoly-bill-service
    restart: unless-stopped

    env_file:
      - ./.env
      - ./bill-service/.env

    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: "8080"
      SERVER_SERVLET_CONTEXT_PATH: ${BILL_SERVER_SERVLET_CONTEXT_PATH:-}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}

    ports:
      - "${BILL_SERVICE_PORT:-8081}:8080"

    depends_on:
      db:
        condition: service_healthy

  admin-tool:
    build:
      context: ./admin-tool
      dockerfile: Dockerfile
    image: ghcr.io/poly-wave/mypoly-admin-tool:0.1
    container_name: mypoly-admin-tool
    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_PORT: "3000"
      ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-}

    ports:
      - "${ADMIN_TOOL_PORT:-3000}:3000"

    depends_on:
      db:
        condition: service_healthy

  bill-batch:
    build:
      context: ./bill-batch
      dockerfile: Dockerfile
    image: ghcr.io/poly-wave/mypoly-bill-batch:0.1
    container_name: mypoly-bill-batch

    env_file:
      - ./.env
      - path: ./bill-batch/.env
        required: false

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA:-bill_service}

    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: